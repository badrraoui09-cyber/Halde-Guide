<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AP Teil 1 — Die Halde</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#f7f3ec;font-family:Inter,sans-serif;color:#1a1814}
    @keyframes logoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:#c9a84c55;border-radius:4px}
    .spinner{width:32px;height:32px;border:3px solid #c9a84c33;border-top-color:#c9a84c;border-radius:50%;animation:spin .7s linear infinite}
    .center{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#080806}
    input{width:100%;padding:12px 14px;border-radius:8px;border:1.5px solid #e8e2d8;font-size:14px;font-family:Inter,sans-serif;outline:none;background:#fdfaf5;color:#1a1814}
    input:focus{border-color:#B8892A}
    .btn{width:100%;padding:13px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#8B6914,#B8892A,#d4a84c);color:#fff;font-size:14px;font-weight:700;font-family:Inter,sans-serif;letter-spacing:.03em;transition:opacity .2s}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .label{font-size:11px;font-weight:600;color:#6b5e45;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:5px}
    .err{background:#fdf0f0;border:1px solid #f0d0d0;border-radius:8px;padding:10px 14px;font-size:12px;color:#8B2020;margin-bottom:14px}
    .card{background:#fff;border-radius:14px;overflow:hidden;transition:box-shadow .3s,transform .3s;border-left:3px solid var(--phase-color)}
    .card.open{box-shadow:0 16px 48px rgba(0,0,0,.13);transform:translateY(-2px)}
    .card:not(.open){box-shadow:0 2px 10px rgba(0,0,0,.07)}
    .card-btn{width:100%;display:flex;align-items:center;gap:14px;padding:15px 18px;background:none;border:none;cursor:pointer;font-family:Inter,sans-serif}
    .cols{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #f0ebe0}
    .col{padding:16px 16px 18px}
    .col+.col{border-left:1px solid #f0ebe0}
    .col-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
    .check-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;cursor:pointer}
    .checkbox{width:15px;height:15px;flex-shrink:0;margin-top:2px;border:1.5px solid #d4c9b0;border-radius:3px;background:#fff;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .checkbox.checked{border-color:#B8892A;background:#B8892A}
  </style>
</head>
<body>
<div id="app"><div class="center"><div class="spinner"></div></div></div>

// ── Particles ────────────────────────────────────────────
const SYMS=["◆","✦","✶","◇","★","·"];
const GOLDS=["#c9a84c","#e8c878","#d4a84c","#f0d890","#a07830"];
let pts=[];
function initParticles(n){
  pts=Array.from({length:n},(_,i)=>({x:Math.random()*100,y:80+Math.random()*20,s:8+Math.random()*12,sp:.15+Math.random()*.35,dr:(Math.random()-.5)*.12,op:.15+Math.random()*.45,sym:SYMS[Math.floor(Math.random()*SYMS.length)],col:GOLDS[Math.floor(Math.random()*GOLDS.length)],rot:Math.random()*360,rs:(Math.random()-.5)*1.2}));
}
function tickParticles(){
  pts=pts.map(p=>{
    let ny=p.y-p.sp,nx=p.x+p.dr,no=p.op;
    if(ny<-5){ny=105;nx=Math.random()*100;no=.15+Math.random()*.45;}
    if(ny<15)no=Math.max(0,p.op*(ny/15));
    return {...p,y:ny,x:nx,op:no,rot:p.rot+p.rs};
  });
  const c=document.getElementById('particles');
  if(!c)return;
  c.innerHTML=pts.map(p=>'<div style="position:absolute;left:'+p.x+'%;top:'+p.y+'%;font-size:'+p.s+'px;color:'+p.col+';opacity:'+p.op+';transform:rotate('+p.rot+'deg);line-height:1;pointer-events:none">'+p.sym+'</div>').join('');
  requestAnimationFrame(tickParticles);
}

// ── Ring SVG ─────────────────────────────────────────────
function ringHTML(pct,color,size){
  const r=(size-5)/2,circ=2*Math.PI*r,offset=circ-(pct/100)*circ;
  return '<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg);flex-shrink:0"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#ede7d9" stroke-width="3"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'" style="transition:stroke-dashoffset .5s ease"/></svg>';
}

// ── Auth Screen ──────────────────────────────────────────
function renderAuth(mode='login',err=''){
  document.getElementById('app').innerHTML=`
  <div style="min-height:100vh;background:#080806;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden">
    <div id="particles" style="position:absolute;inset:0"></div>
    <div style="position:relative;z-index:2;width:100%;max-width:380px;animation:fadeIn .5s ease">
      <div style="text-align:center;margin-bottom:28px">
        <img src="${LOGO}" style="height:60px;object-fit:contain;animation:logoBob 3.5s ease-in-out infinite"/>
        <p style="font-size:11px;color:#6a6050;letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin-top:14px">Ausbildung · AP Teil 1</p>
      </div>
      <div style="background:#fff;border-radius:16px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.4)">
        <h2 style="font-size:20px;font-weight:700;margin-bottom:4px">${mode==='login'?'Willkommen zurück':'Account erstellen'}</h2>
        <p style="font-size:13px;color:#a09880;margin-bottom:22px">${mode==='login'?'Melde dich mit deinem Azubi-Account an.':'Erstelle deinen persönlichen Lernaccount.'}</p>
        ${mode==='register'?`<div style="margin-bottom:12px"><label class="label">Dein Name</label><input id="inp-name" placeholder="z.B. Mia Schmidt"/></div>`:''}
        <div style="margin-bottom:12px"><label class="label">E-Mail</label><input id="inp-email" type="email" placeholder="name@example.com"/></div>
        <div style="margin-bottom:${err?'0':'18px'}"><label class="label">Passwort</label><input id="inp-pw" type="password" placeholder="Mindestens 6 Zeichen"/></div>
        ${err?`<div class="err" style="margin-top:12px">${err}</div>`:''}
        <button class="btn" id="auth-btn" style="margin-top:${err?'14px':'0'}">${mode==='login'?'Anmelden →':'Account erstellen →'}</button>
        <div style="text-align:center;margin-top:14px">
          <button onclick="renderAuth('${mode==='login'?'register':'login'}')" style="background:none;border:none;cursor:pointer;font-size:12px;color:#a09880;font-family:Inter,sans-serif">${mode==='login'?'Noch kein Account? Registrieren':'Bereits registriert? Anmelden'}</button>
        </div>
      </div>
    </div>
  </div>`;
  initParticles(18);requestAnimationFrame(tickParticles);
  document.getElementById('inp-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth(mode);});
  document.getElementById('auth-btn').addEventListener('click',()=>doAuth(mode));
}

async function doAuth(mode){
  const btn=document.getElementById('auth-btn');
  btn.disabled=true;btn.textContent='...';
  const email=document.getElementById('inp-email').value.trim();
  const pw=document.getElementById('inp-pw').value;
  if(mode==='register'){
    const name=(document.getElementById('inp-name')||{}).value||'';
    if(!name){renderAuth('register','Bitte Namen eingeben.');return;}
    const {data,error}=await sb.auth.signUp({email,password:pw});
    if(error){renderAuth('register',error.message);return;}
    if(data.user){
      await sb.from('profiles').insert({id:data.user.id,name:name.trim()});
      currentUser=data.user;userName=name.trim();
      await loadAndRenderApp();
    }
  } else {
    const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){renderAuth('login','Email oder Passwort falsch.');return;}
    const {data:prof}=await sb.from('profiles').select('name').eq('id',data.user.id).single();
    currentUser=data.user;userName=prof?.name||'';
    await loadAndRenderApp();
  }
}

// ── Progress ─────────────────────────────────────────────
async function loadProgress(){
  const {data}=await sb.from('progress').select('check_key').eq('user_id',currentUser.id);
  checks={};
  if(data)data.forEach(r=>{checks[r.check_key]=true;});
}

async function toggleCheck(key){
  const was=checks[key];
  checks[key]=!was;
  updateProgressBar();
  renderWeeks();
  if(!was){
    await sb.from('progress').upsert({user_id:currentUser.id,check_key:key,checked:true,updated_at:new Date().toISOString()},{onConflict:'user_id,check_key'});
  } else {
    await sb.from('progress').delete().eq('user_id',currentUser.id).eq('check_key',key);
  }
}

// ── App ──────────────────────────────────────────────────
let openWeeks={};

async function loadAndRenderApp(){
  await loadProgress();
  renderApp();
}

function renderApp(){
  document.getElementById('app').innerHTML=`
  <div style="min-height:100vh;background:#f7f3ec">
    <!-- Header -->
    <div style="background:#080806;padding:40px 24px 36px;text-align:center;position:relative;overflow:hidden;min-height:200px">
      <div id="particles" style="position:absolute;inset:0"></div>
      <div style="position:relative;z-index:2">
        <img src="${LOGO}" style="height:64px;object-fit:contain;animation:logoBob 3.5s ease-in-out infinite"/>
        <div style="margin-top:16px;margin-bottom:4px;font-size:10px;letter-spacing:.2em;color:#6a6050;text-transform:uppercase;font-weight:600">Hallo, ${userName} · Restaurantfach · 2. Lehrjahr</div>
        <h1 style="font-size:22px;font-weight:700;color:#f5f0e8;letter-spacing:-.01em">AP Teil 1 — Vorbereitungsplan</h1>
        <p style="font-size:13px;margin-top:5px;font-weight:500;background:linear-gradient(90deg,#c9a84c,#f0d060,#c9a84c);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite">12 Wochen · Produktion und Service · 25% der Endnote</p>
        <button onclick="doLogout()" style="position:absolute;top:14px;right:14px;background:#ffffff15;border:1px solid #ffffff20;border-radius:8px;padding:6px 12px;color:#6a6050;font-size:11px;font-family:Inter,sans-serif;cursor:pointer">Abmelden</button>
      </div>
    </div>
    <!-- Progress -->
    <div style="background:#fff;border-bottom:1px solid #ece6d8;padding:14px 20px">
      <div style="max-width:700px;margin:0 auto">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:11px;font-weight:600;color:#a09880;letter-spacing:.06em;text-transform:uppercase">Gesamtfortschritt</span>
          <span id="pct-label" style="font-size:13px;font-weight:700;color:#B8892A">0%</span>
        </div>
        <div style="height:4px;background:#ece6d8;border-radius:4px">
          <div id="pct-bar" style="height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,#8B6914,#B8892A,#d4a84c);transition:width .6s ease"></div>
        </div>
      </div>
    </div>
    <!-- Weeks -->
    <div style="max-width:700px;margin:0 auto;padding:28px 16px 64px">
      <div id="weeks-container"></div>
      <div style="background:#fff;border-radius:10px;padding:12px 18px;border:1px solid #ece6d8;text-align:center;margin-top:8px">
        <span style="font-size:11px;color:#a09880">u-form Nr. 6315 · IHK Südlicher Oberrhein · GastroAusbV 2022</span>
      </div>
    </div>
  </div>`;
  initParticles(18);requestAnimationFrame(tickParticles);
  updateProgressBar();
  renderWeeks();
}

function updateProgressBar(){
  const total=WEEKS.reduce((s,w)=>s+w.c.length,0);
  const done=Object.values(checks).filter(Boolean).length;
  const pct=Math.round((done/total)*100);
  const bar=document.getElementById('pct-bar');
  const lbl=document.getElementById('pct-label');
  if(bar)bar.style.width=pct+'%';
  if(lbl)lbl.textContent=pct+'%';
}

function renderWeeks(){
  const container=document.getElementById('weeks-container');
  if(!container)return;
  let html='';
  PHASES.forEach(phase=>{
    html+='<div style="margin-bottom:32px">';
    html+='<div style="display:flex;align-items:center;margin-bottom:14px">';
    html+='<div style="background:'+phase.color+';color:#fff;padding:5px 14px 5px 18px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:0 20px 20px 0;margin-left:-16px;box-shadow:2px 2px 8px '+phase.color+'40">Phase '+phase.id+' · '+phase.label+'</div>';
    html+='<div style="flex:1;height:1px;background:'+phase.color+'25;margin-left:12px"></div>';
    html+='<span style="font-size:10px;color:#a09880;margin-left:10px">'+phase.sub+'</span></div>';
    html+='<div style="display:flex;flex-direction:column;gap:8px">';
    WEEKS.filter(w=>phase.weeks.includes(w.w)).forEach(week=>{
      const total=week.c.length;
      const done=week.c.filter((_,i)=>checks[week.w+'-'+i]).length;
      const pct=Math.round((done/total)*100);
      const complete=done===total;
      const col=complete?'#B8892A':phase.color;
      const dot=complete?'#B8892A':phase.dot;
      const isOpen=openWeeks[week.w];
      html+='<div class="card'+(isOpen?' open':'')+'" style="--phase-color:'+col+'">';
      html+='<button class="card-btn" onclick="toggleWeek('+week.w+')">';
      html+='<div style="position:relative;width:40px;height:40px;flex-shrink:0">'+ringHTML(pct,dot,40);
      html+='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">'+(complete?'<span style="color:#B8892A;font-size:15px;font-weight:700">✓</span>':'<span style="color:'+phase.color+';font-size:11px;font-weight:700">'+week.w+'</span>')+'</div></div>';
      html+='<div style="flex:1;text-align:left;min-width:0"><div style="font-size:15px;font-weight:600;color:'+(complete?'#B8892A':'#1a1814')+';line-height:1.3">'+week.t+'</div><div style="font-size:11px;color:#a09880;margin-top:2px">'+done+' von '+total+' erledigt</div></div>';
      html+='<div style="width:26px;height:26px;border-radius:50%;background:'+(isOpen?phase.color:'#f0ebe0')+';display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="color:'+(isOpen?'#fff':'#a09880')+';font-size:11px;display:inline-block;transform:'+(isOpen?'rotate(180deg)':'none')+'">▾</span></div>';
      html+='</button>';
      if(isOpen){
        html+='<div class="cols">';
        [[week.p,phase.color,phase.light,'Praxisaufgabe'],[week.s,'#6b5e45','#faf8f3','Schriftlich'],[week.c,'#B8892A','#fdf9f0','Selbstkontrolle']].forEach(([items,accent,bg,lbl],ci)=>{
          html+='<div class="col" style="background:'+bg+'">';
          html+='<div class="col-title" style="color:'+accent+'">'+lbl+'</div>';
          if(ci===2){
            items.forEach((item,i)=>{
              const key=week.w+'-'+i;
              const chk=!!checks[key];
              html+='<div class="check-item" onclick="toggleCheck(''+key+'')">';
              html+='<div class="checkbox'+(chk?' checked':'')+'">'+(chk?'<span style="color:#fff;font-size:9px;font-weight:800">✓</span>':'')+'</div>';
              html+='<span style="font-size:12px;line-height:1.45;color:'+(chk?'#b0a898':'#4a4030')+';text-decoration:'+(chk?'line-through':'none')+'">'+item+'</span>';
              html+='</div>';
            });
          } else {
            items.forEach(item=>{html+='<div style="display:flex;gap:7px;margin-bottom:8px"><span style="color:'+accent+';font-size:8px;margin-top:4px;flex-shrink:0">▶</span><span style="font-size:12px;color:#4a4030;line-height:1.5">'+item+'</span></div>';});
          }
          html+='</div>';
        });
        html+='</div>';
      }
      html+='</div>';
    });
    html+='</div></div>';
  });
  container.innerHTML=html;
}

function toggleWeek(w){
  openWeeks[w]=!openWeeks[w];
  renderWeeks();
}

async function doLogout(){
  await sb.auth.signOut();
  currentUser=null;userName='';checks={};openWeeks={};
  renderAuth();
}

// ── Boot ─────────────────────────────────────────────────
window.addEventListener('load', async function(){
  try {
    await initSupabase();
    const sessionRes = await Promise.race([sb.auth.getSession(), new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),5000))]).catch(()=>({data:{session:null}}));
    const session=sessionRes?.data?.session;
    if(session&&session.user){
      currentUser=session.user;
      const {data:prof}=await sb.from('profiles').select('name').eq('id',session.user.id).single();
      userName=prof?.name||'';
      await loadAndRenderApp();
    } else {
      renderAuth();
    }
  } catch(e){
    document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:red">Fehler: '+e.message+'</div>';
  }
});
</script>

</body>
</html>
