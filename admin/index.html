<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halde Guide – Inhalte bearbeiten</title>
</head>
<body>
  <!-- Netlify Identity muss im Netlify-Dashboard aktiviert sein (Site settings -> Identity) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
  <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
  <script>
    CMS.registerEventListener({
      name: "postPublish",
      handler: () => {
        const notice = document.createElement("div");
        notice.setAttribute("role", "status");
        notice.innerHTML = "<strong>Gespeichert ✓</strong><span>Die Inhalte werden synchronisiert. Der Editor lädt gleich automatisch neu.</span>";
        Object.assign(notice.style, {
          position: "fixed",
          inset: "0",
          zIndex: "999999",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          gap: "12px",
          padding: "24px",
          textAlign: "center",
          color: "#f5f1e8",
          background: "rgba(15, 16, 13, 0.96)",
          font: "18px/1.5 system-ui, sans-serif"
        });
        document.body.appendChild(notice);

        window.setTimeout(() => {
          const freshUrl = `${window.location.pathname}?sync=${Date.now()}${window.location.hash}`;
          window.location.replace(freshUrl);
        }, 15000);
      }
    });
  </script>
</body>
</html>
