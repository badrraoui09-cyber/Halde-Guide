<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halde Guide – Inhalte bearbeiten</title>
</head>
<body>
  <!-- Netlify Identity muss im Netlify-Dashboard aktiviert sein (Site settings -> Identity) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
  <script>
    // Git Gateway can briefly return an old branch reference after a write.
    // Force every gateway read to bypass browser and intermediary caches.
    (() => {
      const isGatewayRead = (method, url) =>
        method.toUpperCase() === "GET" && String(url).includes("/.netlify/git/github");

      const freshUrl = url => {
        const value = new URL(String(url), window.location.origin);
        value.searchParams.set("_halde_cms", `${Date.now()}-${Math.random()}`);
        return value.toString();
      };

      const originalFetch = window.fetch.bind(window);
      window.fetch = (resource, options = {}) => {
        const method = options.method || (resource instanceof Request ? resource.method : "GET");
        const url = resource instanceof Request ? resource.url : resource;

        if (!isGatewayRead(method, url)) {
          return originalFetch(resource, options);
        }

        const headers = new Headers(options.headers || (resource instanceof Request ? resource.headers : undefined));
        headers.set("Cache-Control", "no-cache, no-store");
        headers.set("Pragma", "no-cache");
        const requestOptions = { ...options, headers, cache: "no-store" };
        const target = resource instanceof Request
          ? new Request(freshUrl(resource.url), resource)
          : freshUrl(resource);

        return originalFetch(target, requestOptions);
      };

      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, ...rest) {
        const target = isGatewayRead(method, url) ? freshUrl(url) : url;
        return originalOpen.call(this, method, target, ...rest);
      };
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
  <script>
    let syncScheduled = false;

    const refreshAfterSave = () => {
      if (syncScheduled) return;
      syncScheduled = true;

        const notice = document.createElement("div");
        notice.setAttribute("role", "status");
        notice.innerHTML = "<strong>Gespeichert ✓</strong><span>Die Inhalte werden synchronisiert. Der Editor lädt gleich automatisch neu.</span>";
        Object.assign(notice.style, {
          position: "fixed",
          inset: "0",
          zIndex: "999999",
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          gap: "12px",
          padding: "24px",
          textAlign: "center",
          color: "#f5f1e8",
          background: "rgba(15, 16, 13, 0.96)",
          font: "18px/1.5 system-ui, sans-serif"
        });
        document.body.appendChild(notice);

        window.setTimeout(() => {
          const freshUrl = `${window.location.pathname}?sync=${Date.now()}${window.location.hash}`;
          window.location.replace(freshUrl);
        }, 15000);
    };

    ["postSave", "postPublish"].forEach(name => {
      CMS.registerEventListener({ name, handler: refreshAfterSave });
    });
  </script>
</body>
</html>
