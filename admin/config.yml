backend:
  name: git-gateway
  branch: main

locale: de
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "website"
    label: "Website bearbeiten"
    files:
      - file: "content/site.json"
        label: "Alle Bereiche"
        name: "site"
        fields:
          - label: "Allgemeine Texte"
            name: "settings"
            widget: "object"
            fields:
              - { label: "Name", name: "title", widget: "string" }
              - { label: "Unterzeile", name: "subtitle", widget: "string" }
              - { label: "Überschrift", name: "headline", widget: "string" }
              - { label: "Einleitung", name: "intro", widget: "text" }
              - { label: "Begrüßung", name: "welcome", widget: "string" }
              - { label: "Titel der empfohlenen Lektion", name: "featuredTitle", widget: "string" }
          - label: "Bereiche"
            label_singular: "Bereich"
            name: "departments"
            widget: "list"
            summary: "{{fields.icon}} {{fields.title}}"
            fields:
              - { label: "Interne ID", name: "id", widget: "string", hint: "Kleinbuchstaben, keine Leerzeichen" }
              - { label: "Symbol", name: "icon", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "description", widget: "text" }
              - { label: "Kleine Überschrift", name: "kicker", widget: "string" }
              - { label: "Akzentfarbe", name: "accent", widget: "color" }
              - { label: "Auf Website anzeigen", name: "visible", widget: "boolean", default: true }
              - label: "Lektionen"
                label_singular: "Lektion"
                name: "modules"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Interne ID", name: "id", widget: "string" }
                  - { label: "Nummer", name: "number", widget: "number", value_type: "int" }
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Kurzbeschreibung", name: "description", widget: "string" }
                  - { label: "Dauer in Minuten", name: "duration", widget: "number", value_type: "int" }
                  - { label: "Lektion anzeigen", name: "visible", widget: "boolean", default: true }
                  - label: "Lernkarten"
                    label_singular: "Lernkarte"
                    name: "blocks"
                    widget: "list"
                    summary: "{{fields.title}} {{fields.text}}"
                    fields:
                      - { label: "Interne ID", name: "id", widget: "string" }
                      - label: "Darstellung"
                        name: "type"
                        widget: "select"
                        options:
                          - { label: "Praxiswissen", value: "text" }
                          - { label: "Wichtiger Hinweis", value: "tip" }
                          - { label: "Frage zum Nachdenken", value: "question" }
                          - { label: "Formulierung / Zitat", value: "quote" }
                          - { label: "Checkliste", value: "check" }
                      - { label: "Optionale Überschrift", name: "title", widget: "string", required: false }
                      - { label: "Text", name: "text", widget: "text" }
                      - { label: "Quelle", name: "source", widget: "string", required: false }
                      - label: "Prüfstatus"
                        name: "status"
                        widget: "select"
                        default: "current"
                        options:
                          - { label: "Aktuell", value: "current" }
                          - { label: "Muss bestätigt werden", value: "check" }
                      - { label: "Lernkarte anzeigen", name: "visible", widget: "boolean", default: true }

  - name: "ap1_wochenplan"
    label: "AP1 – 12-Wochen-Plan"
    files:
      - file: "content/weeks.json"
        label: "Wochenplan"
        name: "wochenplan"
        fields:
          - label: "Wochen"
            name: "weeks"
            widget: "list"
            summary: "Woche {{fields.w}} – {{fields.t}}"
            fields:
              - { label: "Wochennummer", name: "w", widget: "number", value_type: "int" }
              - { label: "Titel", name: "t", widget: "string" }
              - label: "Praxis-Aufgaben"
                name: "p"
                widget: "list"
                field: { label: "Punkt", name: "item", widget: "string" }
              - label: "Theorie-Themen"
                name: "s"
                widget: "list"
                field: { label: "Punkt", name: "item", widget: "string" }
              - label: "Checkliste"
                name: "c"
                widget: "list"
                field: { label: "Frage", name: "item", widget: "string" }
