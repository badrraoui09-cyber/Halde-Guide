backend:
  name: git-gateway
  branch: main

locale: de
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "website"
    label: "Website bearbeiten"
    files:
      - file: "content/site.json"
        label: "Alle Bereiche"
        name: "site"
        fields:
          - label: "Allgemeine Texte"
            name: "settings"
            widget: "object"
            fields:
              - { label: "Name", name: "title", widget: "string" }
              - { label: "Unterzeile", name: "subtitle", widget: "string" }
              - { label: "Überschrift", name: "headline", widget: "string" }
              - { label: "Einleitung", name: "intro", widget: "text" }
              - { label: "Begrüßung", name: "welcome", widget: "string" }
              - { label: "Titel der empfohlenen Lektion", name: "featuredTitle", widget: "string" }
          - label: "Bereiche"
            label_singular: "Bereich"
            name: "departments"
            widget: "list"
            summary: "{{fields.icon}} {{fields.title}}"
            fields:
              - { label: "Interne ID", name: "id", widget: "string", hint: "Kleinbuchstaben, keine Leerzeichen" }
              - { label: "Symbol", name: "icon", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "description", widget: "text" }
              - { label: "Kleine Überschrift", name: "kicker", widget: "string" }
              - { label: "Akzentfarbe", name: "accent", widget: "color" }
              - { label: "Auf Website anzeigen", name: "visible", widget: "boolean", default: true, required: false }
              - label: "Lektionen"
                label_singular: "Lektion"
                name: "modules"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Interne ID", name: "id", widget: "string" }
                  - { label: "Nummer", name: "number", widget: "number", value_type: "int" }
                  - { label: "Symbol", name: "icon", widget: "string", required: false }
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Kurzbeschreibung", name: "description", widget: "string" }
                  - { label: "Dauer in Minuten", name: "duration", widget: "number", value_type: "int" }
                  - { label: "Lektion anzeigen", name: "visible", widget: "boolean", default: true, required: false }
                  - label: "Lernkarten"
                    label_singular: "Lernkarte"
                    name: "blocks"
                    widget: "list"
                    summary: "{{fields.title}} {{fields.text}}"
                    fields:
                      - { label: "Interne ID", name: "id", widget: "string" }
                      - label: "Darstellung"
                        name: "type"
                        widget: "select"
                        options:
                          - { label: "Praxiswissen", value: "text" }
                          - { label: "Wichtiger Hinweis", value: "tip" }
                          - { label: "Frage zum Nachdenken", value: "question" }
                          - { label: "Formulierung / Zitat", value: "quote" }
                          - { label: "Checkliste", value: "check" }
                      - { label: "Optionale Überschrift", name: "title", widget: "string", required: false }
                      - { label: "Text", name: "text", widget: "text" }
                      - { label: "Quelle", name: "source", widget: "string", required: false }
                      - label: "Prüfstatus"
                        name: "status"
                        widget: "select"
                        default: "current"
                        required: false
                        options:
                          - { label: "Aktuell", value: "current" }
                          - { label: "Muss bestätigt werden", value: "check" }
                      - { label: "Lernkarte anzeigen", name: "visible", widget: "boolean", default: true, required: false }

  - name: "quiz"
    label: "Übungen & Quiz"
    files:
      - file: "content/quiz.json"
        label: "Quiz bearbeiten"
        name: "quiz"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Einleitung", name: "intro", widget: "text" }
          - label: "Quizfragen"
            label_singular: "Quizfrage"
            name: "questions"
            widget: "list"
            summary: "{{fields.category}} – {{fields.question}}"
            fields:
              - { label: "Interne ID", name: "id", widget: "string" }
              - { label: "Bereich", name: "category", widget: "string" }
              - { label: "Frage", name: "question", widget: "text" }
              - label: "Antwortmöglichkeiten"
                name: "options"
                widget: "list"
                min: 2
                max: 4
                field: { label: "Antwort", name: "answer", widget: "string" }
              - { label: "Nummer der richtigen Antwort", name: "correct", widget: "number", value_type: "int", min: 1, max: 4, hint: "1 = erste Antwort, 2 = zweite Antwort usw." }
              - { label: "Erklärung nach der Antwort", name: "explanation", widget: "text" }
              - { label: "Frage anzeigen", name: "visible", widget: "boolean", default: true, required: false }
