backend:
  name: git-gateway
  branch: main

locale: de
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "website"
    label: "Website bearbeiten"
    files:
      - file: "content/site.json"
        label: "Alle Bereiche"
        name: "site"
        fields:
          - label: "Allgemeine Texte"
            name: "settings"
            widget: "object"
            fields:
              - { label: "Name", name: "title", widget: "string" }
              - { label: "Unterzeile", name: "subtitle", widget: "string" }
              - { label: "Überschrift", name: "headline", widget: "string" }
              - { label: "Einleitung", name: "intro", widget: "text" }
          - label: "Bereiche"
            label_singular: "Bereich"
            name: "departments"
            widget: "list"
            summary: "{{fields.icon}} {{fields.title}}"
            fields:
              - { label: "Interne ID", name: "id", widget: "string", hint: "Kleinbuchstaben, keine Leerzeichen" }
              - { label: "Symbol", name: "icon", widget: "string" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "description", widget: "text" }
              - { label: "Auf Website anzeigen", name: "visible", widget: "boolean", default: true }
              - label: "Kapitel"
                label_singular: "Kapitel"
                name: "sections"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Interne ID", name: "id", widget: "string" }
                  - { label: "Kapitelüberschrift", name: "title", widget: "string" }
                  - { label: "Kapitel anzeigen", name: "visible", widget: "boolean", default: true }
                  - label: "Inhaltsblöcke"
                    label_singular: "Inhaltsblock"
                    name: "blocks"
                    widget: "list"
                    summary: "{{fields.title}} {{fields.text}}"
                    fields:
                      - { label: "Interne ID", name: "id", widget: "string" }
                      - { label: "Optionale Überschrift", name: "title", widget: "string", required: false }
                      - { label: "Text", name: "text", widget: "text" }
                      - { label: "Block anzeigen", name: "visible", widget: "boolean", default: true }

  - name: "ap1_wochenplan"
    label: "AP1 – 12-Wochen-Plan"
    files:
      - file: "content/weeks.json"
        label: "Wochenplan"
        name: "wochenplan"
        fields:
          - label: "Wochen"
            name: "weeks"
            widget: "list"
            summary: "Woche {{fields.w}} – {{fields.t}}"
            fields:
              - { label: "Wochennummer", name: "w", widget: "number", value_type: "int" }
              - { label: "Titel", name: "t", widget: "string" }
              - label: "Praxis-Aufgaben"
                name: "p"
                widget: "list"
                field: { label: "Punkt", name: "item", widget: "string" }
              - label: "Theorie-Themen"
                name: "s"
                widget: "list"
                field: { label: "Punkt", name: "item", widget: "string" }
              - label: "Checkliste"
                name: "c"
                widget: "list"
                field: { label: "Frage", name: "item", widget: "string" }
